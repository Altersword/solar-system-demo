<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>太阳系天体模型 - Solar System Model</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="canvas-container"></div>

    <header id="top-bar">
        <div class="logo">
            <span class="sun-icon" aria-hidden="true">☉</span>
            <div>
                <h1>太阳系天体模型</h1>
                <p>Keplerian Solar System</p>
            </div>
        </div>
        <nav class="controls" aria-label="模拟控制">
            <button id="btn-reset" title="重置视角">
                <span class="icon">↺</span>
                <span class="text">重置</span>
            </button>
            <button id="btn-pause" title="暂停/播放">
                <span class="icon">⏸</span>
                <span class="text">暂停</span>
            </button>
            <button id="btn-labels" title="显示/隐藏标签">
                <span class="icon">Aa</span>
                <span class="text">标签</span>
            </button>
            <button id="btn-orbits" title="显示/隐藏轨道">
                <span class="icon">◎</span>
                <span class="text">轨道</span>
            </button>
        </nav>
    </header>

    <aside id="science-panel">
        <div class="panel-row">
            <span>模型</span>
            <strong id="mode-name">观赏比例</strong>
        </div>
        <div class="segmented" role="group" aria-label="比例模式">
            <button id="mode-balanced" class="active" data-mode="balanced">观赏</button>
            <button id="mode-compact" data-mode="compact">距离感</button>
        </div>
        <p id="mode-description">距离压缩，半径放大，适合观察整体结构</p>
        <div class="panel-row">
            <span>已模拟</span>
            <strong id="elapsed-days">0 天</strong>
        </div>
    </aside>

    <section id="time-control" aria-label="时间控制">
        <label for="time-slider">时间倍速</label>
        <input type="range" id="time-slider" min="0" max="13" value="4">
        <span id="time-display">1 天/秒</span>
        <div class="time-buttons">
            <button id="btn-time-slower" title="减速">⏪</button>
            <button id="btn-time-faster" title="加速">⏩</button>
        </div>
    </section>

    <aside id="info-panel" class="hidden">
        <button id="close-info" class="close-btn" title="关闭">&times;</button>
        <div id="planet-info-content">
            <h2 id="planet-name">地球</h2>
            <div class="info-section">
                <h3>基本信息</h3>
                <p><strong>直径</strong><span id="info-diameter">12,742 km</span></p>
                <p><strong>质量</strong><span id="info-mass">5.972e+24 kg</span></p>
                <p><strong>轨道半长轴</strong><span id="info-distance">1 AU</span></p>
                <p><strong>轨道周期</strong><span id="info-period">365.256 天</span></p>
                <p><strong>自转周期</strong><span id="info-rotation">23.934 小时</span></p>
            </div>
            <div class="info-section">
                <h3>物理特性</h3>
                <p><strong>类型</strong><span id="info-type">类地行星</span></p>
                <p><strong>组成/大气</strong><span id="info-atmosphere">氮、氧、氩</span></p>
                <p><strong>温度</strong><span id="info-temperature">表面平均约15°C</span></p>
                <p><strong>卫星数量</strong><span id="info-moons">1</span></p>
                <p><strong>特征</strong><span id="info-feature">液态水海洋</span></p>
            </div>
            <div class="info-section moons-section">
                <h3>主要卫星</h3>
                <div id="moons-list"></div>
            </div>
        </div>
    </aside>

    <aside id="music-player">
        <div class="music-header">
            <span class="music-icon">♫</span>
            <span class="music-title">星际穿越原声带</span>
        </div>
        <div class="music-controls">
            <button id="music-upload" title="上传音乐文件">
                <span class="icon">📁</span>
                <span>上传</span>
            </button>
            <button id="music-prev" title="上一首" disabled>⏮</button>
            <button id="music-play" title="播放/暂停" disabled>
                <span class="icon">▶</span>
            </button>
            <button id="music-next" title="下一首" disabled>⏭</button>
            <input type="file" id="music-file" accept="audio/*" hidden multiple>
        </div>
        <div class="music-progress">
            <div id="music-track-info">未加载音乐</div>
            <div class="progress-bar">
                <div id="music-progress"></div>
            </div>
            <div class="time-info">
                <span id="current-time">0:00</span>
                <span id="duration">0:00</span>
            </div>
        </div>
        <div class="music-volume">
            <span class="volume-icon">🔊</span>
            <input type="range" id="volume-slider" min="0" max="100" value="70" aria-label="音量">
        </div>
        <div id="music-playlist" class="hidden"></div>
    </aside>

    <div id="loading">
        <div class="loading-content">
            <div class="spinner"></div>
            <p>正在构建太阳系模型...</p>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="js/planetData.js"></script>
    <script src="js/orbitalMechanics.js"></script>
    <script src="js/musicPlayer.js"></script>
    <script src="js/specials/blackHoleRenderer.js"></script>
    <script src="js/solarSystem.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
